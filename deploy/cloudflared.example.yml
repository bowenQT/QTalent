# Replace these non-secret placeholders on the deployment host; do not deploy this file directly.
tunnel: REPLACE_WITH_NAMED_TUNNEL_ID
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_ID.json
ingress:
  - hostname: qtalent.example.test
    path: ^/stream$
    service: http://127.0.0.1:3001
  - hostname: qtalent.example.test
    service: http://127.0.0.1:3000
  - service: http_status:404
