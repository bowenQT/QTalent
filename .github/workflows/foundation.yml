name: foundation
# 原型、评审站和文档不进入工程检查：原型材料只从 prototype-reference.json 固定的提交读取，
# 改参照本身（根目录的 prototype-reference.json）照常触发。
on:
  pull_request:
    paths-ignore:
      - 'prototype/**'
      - 'review-site/**'
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'prototype/**'
      - 'review-site/**'
      - 'docs/**'
      - '*.md'
permissions:
  contents: read
# PR 只保留最新一次运行；main 的每个提交单独运行，后续合并不再取消前一次。
concurrency:
  group: foundation-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token 只用于向 Codecov 证明上传来自本仓库的 CI，不需要保存上传令牌。
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qtalent
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: qtalent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qtalent -d qtalent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://qtalent:isolated-ci-only@127.0.0.1:5432/qtalent_test
      TEST_DATABASE_URL: postgresql://qtalent:isolated-ci-only@127.0.0.1:5432/qtalent_test
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: synthetic-ci-secret-not-valid-outside-isolated-tests
      DEMO_PASSWORD: synthetic-ci-password-only
      ACCESS_ENFORCED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate BOW-923 workbooks
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/fixtures/bow-923/validate-workbooks.py tests/fixtures/bow-923
      - name: Test BOW-923 workbook validation
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover
          -s tests/fixtures/bow-923 -p 'test_*.py'
      - name: Test BOW-923 input isolation
        run: node --test --test-concurrency=2 tests/fixtures/bow-923/seed-input.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm reference:prepare
      - name: Verify deployment scripts
        run: >-
          node --test --test-concurrency=2 --experimental-test-coverage
          '--test-coverage-include=deploy/*.mjs'
          '--test-coverage-exclude=deploy/*.test.mjs'
          --test-coverage-lines=85 --test-coverage-branches=85
          deploy/*.test.mjs
      - name: Install and verify fixed official media tools
        timeout-minutes: 5
        run: bash scripts/install-official-media.sh
      - name: Verify actual media adapters
        timeout-minutes: 3
        run: >-
          pnpm exec vitest run --maxWorkers=2
          src/server/usecases/recordings/audio-probe.test.ts
          src/server/usecases/recordings/inspect-audio.test.ts
      - run: pnpm check
        id: quality
      # 覆盖率门槛由 pnpm check 把关；Codecov 只展示，上传失败不影响检查结论。
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - run: pnpm test:e2e
      - run: pnpm test:visual
        if: ${{ !cancelled() && steps.quality.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-verification
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
