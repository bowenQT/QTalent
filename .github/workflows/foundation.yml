name: foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qtalent
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: qtalent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qtalent -d qtalent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://qtalent:isolated-ci-only@127.0.0.1:5432/qtalent_test
      TEST_DATABASE_URL: postgresql://qtalent:isolated-ci-only@127.0.0.1:5432/qtalent_test
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: synthetic-ci-secret-not-valid-outside-isolated-tests
      DEMO_PASSWORD: synthetic-ci-password-only
      ACCESS_ENFORCED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm reference:prepare
      - name: Generate BOW-834 pending migration and formatted evidence test
        run: |
          rm src/server/db/migrations/0001_chunky_fenris.sql src/server/db/migrations/meta/0001_snapshot.json
          node --input-type=module -e "import fs from 'node:fs'; const p='src/server/db/migrations/meta/_journal.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.entries=j.entries.filter(e=>e.idx===0); fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n');"
          pnpm db:generate
          pnpm exec prettier --write src/server/modules/records/schema.ts src/server/db/seed/evidence.integration.test.ts
          mkdir -p recovery-generated/src/server/db/seed recovery-generated/src/server/modules/records
          cp -R src/server/db/migrations recovery-generated/src/server/db/
          cp src/server/db/seed/evidence.integration.test.ts recovery-generated/src/server/db/seed/
          cp src/server/modules/records/schema.ts recovery-generated/src/server/modules/records/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          function walk(dir) { for (const entry of fs.readdirSync(dir,{withFileTypes:true})) { const p=dir+'/'+entry.name; if(entry.isDirectory())walk(p); else { const content=fs.readFileSync(p,'utf8'); const path=p.replace('recovery-generated/',''); const bytes=Buffer.from(content); const sha=crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex'); console.log('BOW834_GENERATED '+JSON.stringify({path,content,sha})); } } }
          walk('recovery-generated');
          NODE
      - run: pnpm check
        id: quality
      - run: pnpm test:e2e
      - run: pnpm test:visual
        if: ${{ !cancelled() && steps.quality.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-verification
          path: |
            recovery-generated/
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
